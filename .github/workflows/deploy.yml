name: Deploy Admin

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  # Runs BEFORE anything is built: the Docker build executes `npm run build` and the PostCSS/ESLint configs, so a poisoned
  # file (known obfuscated payload) must never reach it. Fails the whole pipeline instead of building it.
  security-gate:
    name: Security gate (refuse the known obfuscated payload)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refuse known payload markers and hidden long lines
        run: |
          if git grep -nE "_0x[0-9a-f]{4,6}|global\.i *= *'|node (init|api\.js)" -- . ':!node_modules' ':!package-lock.json' ':!.github'; then
            echo "::error::Known malicious payload markers found in the repository. Refusing to build."
            exit 1
          fi
          LONG=$(git ls-files '*.config.js' '*.config.mjs' '*.config.cjs' '*.config.ts' init api.js             | xargs -r awk 'length($0) > 2000 { print FILENAME ": line " FNR " has " length($0) " chars" }')
          if [ -n "$LONG" ]; then
            echo "$LONG"
            echo "::error::Abnormally long line in a config/script file (possible hidden payload)."
            exit 1
          fi
          echo "Security gate passed."

  build-and-push:
    needs: security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: string
        run: |
          IMAGE_ID=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_id=ghcr.io/$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Build and push Admin Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.string.outputs.image_id }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare configuration files
        run: |
          echo "DOCKER_COMPOSE_B64=$(base64 -w 0 docker-compose.prod.yml)" >> $GITHUB_ENV
          echo "CADDYFILE_B64=$(base64 -w 0 Caddyfile)" >> $GITHUB_ENV

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_COMPOSE_B64: ${{ env.DOCKER_COMPOSE_B64 }}
          CADDYFILE_B64: ${{ env.CADDYFILE_B64 }}
        with:
          host: 178.105.255.135
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          envs: DOCKER_COMPOSE_B64,CADDYFILE_B64
          script: |
            mkdir -p /app/diettemple
            cd /app/diettemple
            
            # Write configuration files directly
            echo "$DOCKER_COMPOSE_B64" | base64 -d > docker-compose.yml
            echo "$CADDYFILE_B64" | base64 -d > Caddyfile
            
            # Log in to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Make sure directories and environment file exist
            mkdir -p backend
            touch backend/.env
            
            # Pull only the admin service and restart it
            docker compose pull admin
            docker compose up -d admin
            
            # Keep shared infrastructure running. Caddy does not automatically
            # reload a changed bind-mounted Caddyfile, so restart it explicitly.
            docker compose up -d mongodb minio caddy
            docker compose restart caddy
            
            # Cleanup old Docker images
            docker image prune -f
